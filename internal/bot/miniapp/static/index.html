<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Verify</title>
<link rel="stylesheet" href="/v/static/styles.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<main id="app" aria-live="polite">
  <header>
    <div class="header-row">
      <div class="brand">Group verification</div>
      <div class="progress" id="progress" aria-label="progress"></div>
    </div>
    <div class="progressbar" role="progressbar" aria-labelledby="progress"
         aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressbar">
      <div class="progressbar-fill" id="progressbar-fill"></div>
    </div>
  </header>
  <section class="challenge" id="challenge" hidden>
    <p class="prompt" id="prompt"></p>
    <div class="image-wrap">
      <img id="challenge-image" alt="" decoding="async">
    </div>
    <div class="options" id="options" role="group" aria-label="Label options"></div>
  </section>
  <section class="state" id="state-loading"><p>Loading…</p></section>
  <section class="state" id="state-passed" hidden>
    <h2>✓ Verified</h2>
    <p>You'll be admitted to the group in a moment.</p>
  </section>
  <section class="state" id="state-failed" hidden>
    <h2>Verification failed</h2>
    <p>Please try requesting to join again.</p>
  </section>
  <section class="state" id="state-error" hidden>
    <h2>Something went wrong</h2>
    <p id="error-detail"></p>
  </section>
</main>
<script src="/v/static/app.js" defer></script>
</body>
</html>
